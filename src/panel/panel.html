<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>德州胜率助手</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <!-- 顶部标题条（极简） -->
    <header class="topbar">
      <span class="topbar__title">♠ 胜率助手</span>
      <span id="status" class="topbar__status">等待牌局…</span>
    </header>

    <!-- 对手风格选择：决定"假设对手手里有多强的牌"，直接影响胜率高低。 -->
    <div class="stylebar">
      <label for="opponentStyle" class="stylebar__label">对手牌力</label>
      <select id="opponentStyle" class="stylebar__select"></select>
      <span id="styleDesc" class="stylebar__desc"></span>
    </div>

    <!-- 自动托管控制区：总开关 + 策略档位 + 最近动作。 -->
    <section class="autopilot">
      <div class="autopilot__head">
        <div class="autopilot__title">
          自动托管
          <span class="autopilot__hint">（打开后插件会自动替你出牌）</span>
        </div>
        <!-- 开关：用 checkbox 做成滑块样式，状态存 chrome.storage -->
        <label class="switch">
          <input type="checkbox" id="autopilotEnabled" />
          <span class="switch__slider"></span>
        </label>
      </div>

      <div class="autopilot__row">
        <label for="strategyTier" class="autopilot__label">策略档位</label>
        <select id="strategyTier" class="stylebar__select"></select>
      </div>
      <p id="tierDesc" class="autopilot__desc"></p>

      <!-- 最近一次自动动作（没动作时隐藏） -->
      <div id="lastAction" class="last-action" hidden>
        <span class="last-action__badge" id="lastActionBadge">—</span>
        <span class="last-action__reason" id="lastActionReason"></span>
      </div>
    </section>


    <!-- 没有可算数据时显示的提示 -->
    <div id="empty" class="empty">
      进入牌桌、拿到你的两张底牌后，这里会自动显示胜率。
    </div>

    <!-- 胜率主体（有数据时才显示） -->
    <main id="body" class="body" hidden>
      <!-- 你的牌 + 公共牌 -->
      <section class="hand">
        <div class="hand__row">
          <span class="hand__label">你的牌</span>
          <div id="myCards" class="hand__cards"></div>
        </div>
        <div class="hand__row">
          <span class="hand__label">公共牌</span>
          <div id="boardCards" class="hand__cards"></div>
        </div>
      </section>

      <!-- 大号胜率圆环 + 胜平负 -->
      <section class="gauge-wrap">
        <div id="gauge" class="gauge">
          <div id="winValue" class="gauge__value">--%</div>
          <div class="gauge__label">胜率</div>
        </div>
        <div class="breakdown">
          <div class="bd-row"><span class="dot dot--win"></span>胜 <b id="win">--</b>%</div>
          <div class="bd-row"><span class="dot dot--tie"></span>平 <b id="tie">--</b>%</div>
          <div class="bd-row"><span class="dot dot--lose"></span>负 <b id="lose">--</b>%</div>
        </div>
      </section>

      <!-- 两个关键信息 -->
      <section class="info">
        <div class="info__cell">
          <div class="info__label">当前牌型</div>
          <div id="handName" class="info__value">—</div>
        </div>
        <div class="info__cell">
          <div class="info__label">对手人数</div>
          <div id="opponents" class="info__value">—</div>
        </div>
      </section>

      <!-- 听牌提示（没有则隐藏） -->
      <div id="draws" class="draws" hidden></div>

      <!-- 诚实说明：让你知道这个数字怎么来的 -->
      <p class="note">
        <span id="noteStyle">按"对手标准牌力"估算</span>（<span id="samples">—</span> 次模拟），对手真实打法未知，仅供参考。
      </p>
    </main>

    <script type="module" src="panel.js"></script>
  </body>
</html>
