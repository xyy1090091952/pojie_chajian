<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>德州胜率助手</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <!-- 顶部标题条（极简） -->
    <header class="topbar">
      <span class="topbar__title">♠ 胜率助手</span>
      <span id="status" class="topbar__status">等待牌局…</span>
    </header>

    <!-- 对手风格选择：决定"假设对手手里有多强的牌"，直接影响胜率高低。 -->
    <div class="stylebar">
      <label for="opponentStyle" class="stylebar__label">对手牌力</label>
      <select id="opponentStyle" class="stylebar__select"></select>
      <span id="styleDesc" class="stylebar__desc"></span>
    </div>

    <!-- 自动托管控制区：总开关 + 策略档位 + 最近动作。 -->
    <section class="autopilot">
      <div class="autopilot__head">
        <div class="autopilot__title">
          自动托管
          <span class="autopilot__hint">（打开后插件会自动替你出牌）</span>
        </div>
        <!-- 开关：用 checkbox 做成滑块样式，状态存 chrome.storage -->
        <label class="switch">
          <input type="checkbox" id="autopilotEnabled" />
          <span class="switch__slider"></span>
        </label>
      </div>

      <div class="autopilot__row">
        <label for="strategyTier" class="autopilot__label">策略档位</label>
        <select id="strategyTier" class="stylebar__select"></select>
      </div>
      <p id="tierDesc" class="autopilot__desc"></p>

      <div class="autopilot__row">
        <label for="aggressionProfile" class="autopilot__label">打法倾向</label>
        <select id="aggressionProfile" class="stylebar__select"></select>
      </div>

      <div class="autopilot__row">
        <label for="valueBetProfile" class="autopilot__label">大牌下注</label>
        <select id="valueBetProfile" class="stylebar__select"></select>
      </div>
      <p id="profileDesc" class="autopilot__desc"></p>

      <!-- 房主专用开关：局间自动点"开始下一手"，避免卡在两局之间。
           只有托管总开关打开时才生效，所以默认开着也安全。 -->
      <div class="autopilot__row autopilot__row--switch">
        <label for="autoNextHand" class="autopilot__label">
          自动开始下一手
          <span class="autopilot__hint">（房主：局间自动开下一局）</span>
        </label>
        <label class="switch">
          <input type="checkbox" id="autoNextHand" />
          <span class="switch__slider"></span>
        </label>
      </div>

      <!-- 接下来打算做（动手之前的预告，没预告时隐藏） -->
      <div id="nextPlan" class="last-action last-action--plan" hidden>
        <span class="last-action__badge last-action__badge--plan" id="nextPlanBadge">—</span>
        <span class="last-action__reason" id="nextPlanReason"></span>
      </div>

      <!-- 最近一次自动动作（没动作时隐藏） -->
      <div id="lastAction" class="last-action" hidden>
        <span class="last-action__badge" id="lastActionBadge">—</span>
        <span class="last-action__reason" id="lastActionReason"></span>
      </div>
    </section>

    <!-- 对手画像状态卡：把"你手选的"和"机器人边打边记学到的"合并成一张卡，
         一眼看清：此刻到底按哪个画像算、它从哪来、以及怎么改回来。
         ⚠️ 机器人只有拿到可靠数据(手牌编号+本人身份+足够样本)才接管，
            否则老实退回你手选的，绝不编造（和决策层同一条红线）。 -->
    <section class="picture">
      <div class="picture__head">
        <span class="picture__title">对手画像</span>
        <span class="picture__source" id="pictureSource">你手选</span>
      </div>
      <div class="picture__main">
        <span class="picture__label">当前生效</span>
        <span class="picture__style" id="pictureStyle">标准（常规）</span>
        <button type="button" class="picture__reset" id="pictureReset" hidden>改回自动</button>
      </div>
      <p class="picture__hint" id="pictureHint"></p>
      <!-- 边打边记的原始观察明细（观察手数 / 入池率 / 为什么还不可靠） -->
      <div id="oppmodelBody" class="oppmodel__body">观察中…</div>
    </section>


    <!-- 没有可算数据时显示的提示 -->
    <div id="empty" class="empty">
      进入牌桌、拿到你的两张底牌后，这里会自动显示胜率。
    </div>

    <!-- 胜率主体（有数据时才显示） -->
    <main id="body" class="body" hidden>
      <!-- 你的牌 + 公共牌 -->
      <section class="hand">
        <div class="hand__row">
          <span class="hand__label">你的牌</span>
          <div id="myCards" class="hand__cards"></div>
        </div>
        <div class="hand__row">
          <span class="hand__label">公共牌</span>
          <div id="boardCards" class="hand__cards"></div>
        </div>
      </section>

      <!-- 大号胜率圆环 + 胜平负 -->
      <section class="gauge-wrap">
        <div id="gauge" class="gauge">
          <div id="winValue" class="gauge__value">--%</div>
          <div class="gauge__label">胜率</div>
        </div>
        <div class="breakdown">
          <div class="bd-row"><span class="dot dot--win"></span>胜 <b id="win">--</b>%</div>
          <div class="bd-row"><span class="dot dot--tie"></span>平 <b id="tie">--</b>%</div>
          <div class="bd-row"><span class="dot dot--lose"></span>负 <b id="lose">--</b>%</div>
        </div>
      </section>

      <!-- 两个关键信息 -->
      <section class="info">
        <div class="info__cell">
          <div class="info__label">当前牌型</div>
          <div id="handName" class="info__value">—</div>
        </div>
        <div class="info__cell">
          <div class="info__label">对手人数</div>
          <div id="opponents" class="info__value">—</div>
        </div>
      </section>

      <!-- 听牌提示（没有则隐藏） -->
      <div id="draws" class="draws" hidden></div>

      <!-- 诚实说明：让你知道这个数字怎么来的 -->
      <p class="note">
        <span id="noteStyle">按"对手标准牌力"估算</span>（<span id="samples">—</span> 次模拟），对手真实打法未知，仅供参考。
      </p>
    </main>

    <script type="module" src="panel.js"></script>
  </body>
</html>
